# `project-ci` here is this workflow's own display name (the Actions-tab label) — it has never
# been a job id or a check-run name in this file, so it is not at risk from the defect below by
# itself. The defect is generic, though: GitHub always names a check run after the *job* (or a
# job's explicit `name:`), never the workflow, and always appends matrix values to whichever name
# that job has. `verify-matrix` hit this because branch protection, `docs/ops/branch-protection.md`,
# and `tests/e2e/real-component-integration.test.ts` all pin the literal string `verify` — the full
# audit of what depends on that string is in PR #694's body. If any *other* job here (or
# `verify-gate` itself) is ever given a matrix while something still depends on its bare name, it
# breaks the identical way: the name that dependants expect stops being producible, silently.
name: project-ci
on:
  push:
    branches: [main, 'release/**', 'hotfix/**']
  # A daily run re-verifies `main` on a tree no push changed.
  schedule:
    - cron: '41 5 * * *'
  # No base filter. `branches` under `pull_request` matches the PR's *base*, so every prefix a
  # pull request can target has to be listed or that PR gets no checks at all — and a list of
  # prefixes goes stale exactly like any other check keyed by a name rather than by content.
  #
  # It already had. Measured 2026-09-12 against `git ls-remote --heads origin`: `fix/` 56,
  # `feat/` 39, `terra10/` 27, `docs/` 9, `test/` 3, and `feature/` — the prefix this filter
  # named — **1**. `release/` was 0, and no merge commit in this repository's history came from a
  # `feature/` branch. So the filter covered `main` and effectively nothing else, and #855, based
  # on a `feat/` branch, got **zero** check runs.
  #
  # Zero checks is worse than a red one. `gh pr list --json statusCheckRollup` summarises it as
  # `fail=0 pend=0`, which is indistinguishable from all-green, and a base branch carries no
  # protection rules to notice. `scripts/merge-pr.mjs:133` is what actually caught it — "no check
  # reported on <sha>. A green claim needs a run." — and `gh pr merge` goes around that.
  #
  # Ruled out: listing `feat/**` and `fix/**` beside the others. It fixes today's two prefixes and
  # leaves the same mechanism in place for the next one, with no check that would notice — which
  # is how this filter came to name a prefix used once (#857).
  pull_request:

# A force-push does not cancel the run it supersedes, and that run keeps its eight macOS jobs until
# it finishes -- on a head nobody will merge. Measured 2026-09-15, right after #943 was rebased
# past two merges:
#
#     34973735898  64dd3a35  in_progress   <- the head the pull request now points at
#     34966057871  53806331  in_progress   <- the pre-rebase head, still holding slots
#
# Nothing in this repository cancelled the second one; a person did. #885 measures what that costs:
# eight macOS jobs per pull request against a supply observed between three and five concurrent,
# and a rebase is how a conflicting pull request is *made* mergeable, so this is ordinary traffic
# rather than an accident.
#
# `cancel-in-progress` is false for `push` deliberately, and that is the whole care in this block.
# Grouping by `github.ref` puts every `main` push in one group, so a blanket `true` would cancel the
# run a merge started as soon as the next merge landed. A cancelled run reports `cancelled`,
# which `verify-gate` below already treats as not-success, so the cost of getting this wrong is a
# red `main` for a tree that was never tested rather than a slow queue.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# One Node, the one the daemon is deployed on. 22.23.2 is the version the peercred addon's
# provenance pins (ADR-0010) and the floor CommitLore's installer enforces, so the gate runs on the
# runtime that ships and `pnpm ci:commitlore` needs no Node of its own.
#
# Ruled out: keeping the `22.18.0` (declared `engines.node` floor, ADR-0010) and `22` (moving
# alias) legs. Each ran every gate and the whole suite again on macOS for a runtime nothing
# deploys. The engines floor is therefore no longer exercised by CI.
env:
  NODE_VERSION: "22.23.2"

# The run, as a graph. `pnpm gates` used to be one job of ~37 minutes, 2105 s of it the suite:
#
#   test-reuse ──► verify-matrix (3 suite shards, macOS) ──┐
#   gates (every other gate, macOS) ───────────────────────┼──► verify-gate (bare `verify`)
#
# `gates` and the shards run side by side, so the required check waits for the slowest shard
# rather than for the sum. `--no-tests` and `--tests-only` are the two complementary halves of
# `scripts/lib/prepush-gates.mjs`, split on the suite alone, so every gate runs in every run — the
# suite excepted only on a push whose exact tree a pull-request run already passed (`test-reuse`).
jobs:
  # Whether this run may skip the suite because the pull-request run this push merged already
  # passed every shard on the tree, base and workflow it lands. Only a `push` can say yes, and only
  # when `scripts/ci-reuse-verified-tree.mjs` proves it — read that file for the six conditions:
  # the run is the one on the squash's `Merged-Head`, and the `ci-executed-*` record each of its
  # jobs wrote from its own checkout matches this push. Every other event, and every unproven or
  # unreadable case, answers no and the shards run. This job never fails the run by answering no;
  # if it fails outright its output is empty, and empty also runs the shards.
  test-reuse:
    name: test reuse
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Read-only: the run, job and artifact records of the pull-request run this push merged, and
      # its `ci-executed-*` artifacts, which `gh run download` fetches with this same read scope.
      actions: read
    outputs:
      reuse: ${{ steps.decide.outputs.reuse }}
      run_id: ${{ steps.decide.outputs.run_id }}
      head_sha: ${{ steps.decide.outputs.head_sha }}
      tree_sha: ${{ steps.decide.outputs.tree_sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - id: decide
        run: node scripts/ci-reuse-verified-tree.mjs
        env:
          GH_TOKEN: ${{ github.token }}

  # Every gate but the suite, once per run, on every event — a reused push included. One step, one
  # manifest, one executor: every gate is in `scripts/lib/prepush-gates.mjs`, and `pnpm gates` is
  # what a developer runs before pushing — the same command, the same order, the same fail-fast
  # stop. It replaced twenty listed steps here because a list CI owns is a list nobody can execute:
  # #736 was verified locally against a hand-made set of four checks and failed here in 35 seconds
  # on `pnpm lint`, which was not on it, and the same wrong set went into four subagent briefs.
  #
  # `pnpm ci:preflight` used to run here a second time, as its own step before install. It is the
  # first gate of `pnpm gates --no-tests`, on the same tree in the same job, so the separate step
  # was the same command and the same verdict twice; the gate copy is the one `pnpm gates` keeps.
  #
  # The job log stays per-gate. The runner prints a banner and an exit code for every gate, an
  # `::error::` annotation naming the one that failed, and a table of all of them to the run's
  # step summary — which is also the readback that this job ran the runner rather than a step
  # list of its own.
  #
  # Named `verify (gates)`, never bare `verify`: `scripts/merge-pr.mjs` refuses a run with more than
  # one job of that exact name, and the bare name belongs to `verify-gate`.
  gates:
    name: verify (gates)
    runs-on: macos-15
    permissions:
      contents: read
      # Read-only, for `pnpm merge-records`: it asks GitHub which pull request a `(#N)` commit
      # belongs to, through the `GH_TOKEN` on the gates step below and nowhere else.
      pull-requests: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # The trailer check reads every commit message in the range, and the default
          # shallow clone has one. A range that cannot be resolved makes that check exit 2
          # rather than report a clean result, so this is what keeps it from being a step
          # that always fails and gets deleted.
          fetch-depth: 0
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 10
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      # What this job executes, read from its own checkout before any gate runs: on `pull_request`
      # that is GitHub's synthetic merge, whose first parent is the base it was tested against. A
      # later `main` push reuses this run only if every job's record matches what it lands.
      # `overwrite` so a re-run job replaces its own record rather than failing on the name.
      - run: node scripts/ci-reuse-verified-tree.mjs --record gates
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: ci-executed-gates
          path: evidence/local/ci-executed.json
          if-no-files-found: error
          overwrite: true
      # `pnpm trailers` spawns `commitlore` to judge a message carrying more than one record: SPEC
      # §2.4 recovers separate identified record paragraphs, and git's trailer parser, which reads
      # only the last one, is not that authority. A hosted runner has no such program, so the spawn
      # raises ENOENT and the check reports "multi-record semantic validation failed or could not
      # run" — the same words a malformed message gets. Measured on `507ad977` with one variable
      # changed: with the CLI on PATH the range passes; with it absent the failure is byte-identical
      # to the one this job produced. `commitlore-preserve.yml` installs it and already wrote the
      # lesson down — "so a resolution failure is reported as one rather than as 'cannot parse the
      # merge message'" — and nothing propagated it to the job that runs the gate.
      - run: pnpm ci:commitlore
      - run: pnpm install --frozen-lockfile
      - run: pnpm rebuild better-sqlite3
      # ADR-0010: this repository's own binding.gyp + node-addon-api convention for native
      # addons, prebuilt here rather than compiled on load. macos-15 is the only runner these jobs
      # use, so this is also where #539's Darwin-only peercred addon gets built.
      - run: pnpm native:peercred:build
      - run: pnpm native:fd-vfs:build
      # ACP_TRAILERS_RANGE is the one workflow-specific value the runner takes: which commits to
      # read is a property of the event GitHub is handling, not of the gate. Unset locally, where
      # the check uses its own default of `origin/main..HEAD`.
      #
      # The far end is the pull request's **head**, never the checkout's `HEAD`. On a pull_request
      # event `actions/checkout` gives us the merge ref, so `HEAD` is a commit GitHub composed:
      #
      #     HEAD is now at 12db39f Merge b47512d... into 573f7eab...
      #
      # Its first parent is the base branch tip, so `base.sha..HEAD` sweeps in every commit the
      # base branch gained since `base.sha` — including squash merges GitHub's own button composed,
      # which no commit-msg hook can reach and which nobody can fix without rewriting the base
      # branch. One such merge then fails this gate on *every* open pull request based before it,
      # for a commit none of them authored. Measured: `573f7eab` (the #867 squash) carries eleven
      # record-trailer lines in its body, of which git parses three, and it turned two green pull
      # requests red at once. Its records were not lost -- `commitlore-preserve` attached them as
      # notes -- so the only thing the failure established was that the range was wrong.
      #
      # `base.sha..head.sha` is the pull request's own commits and nothing else.
      #
      # And the notes ref below, because `pnpm trailers` reads both places a record can be stored. A
      # squash merge strands the branch's earlier records mid-message and `commitlore-preserve`
      # attaches them to the merge commit as a note; a checkout that never fetched that ref cannot
      # tell a preserved record from a lost one, and the gate refuses rather than guess. `checkout`
      # does not bring notes refs down, `fetch-depth: 0` or not.
      - run: pnpm notes:fetch
      - run: pnpm gates --no-tests
        env:
          ACP_TRAILERS_RANGE: ${{ github.event.pull_request.base.sha && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || 'HEAD~1..HEAD' }}
          # `merge-records` reads pull requests through `gh api`; the job's token is read-only.
          GH_TOKEN: ${{ github.token }}

  # The suite, as Vitest's own `--shard=i/N`, one macOS job per shard. Vitest partitions by a hash
  # of each file's path, so the N jobs between them run every file once; `verify-gate` checks that
  # against the tree on every run rather than trusting it (`scripts/merge-vitest-results.mjs`).
  # N is `strategy.job-total`, so the shard count is the matrix's length and cannot disagree with it.
  #
  # Each shard prepares its runner exactly as the single job did before the suite: the same
  # checkout depth, CommitLore on PATH (`tests/unit/commitlore-pin.test.ts` skips without it), the
  # same native builds, the notes ref, and `pnpm build` for the `dist/` the process-level tests
  # spawn. A shard that skipped one of those would not fail; its tests would quietly see less.
  #
  # The job id used to be `verify` and then carried the Node matrix; branch protection requires
  # the literal `verify` (contexts: ["verify"]), and a matrixed job's check always has its matrix
  # values appended, so the bare name comes from `verify-gate` and these report as
  # "verify (shard 1/3)" and so on.
  #
  # Skipped only when `test-reuse` said `true`. That condition and `verify-gate`'s excuse for a
  # skipped matrix are one decision in two places, and move together.
  verify-matrix:
    name: verify (shard ${{ matrix.shard }}/${{ strategy.job-total }})
    needs: [test-reuse]
    if: ${{ !cancelled() && needs.test-reuse.outputs.reuse != 'true' }}
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 10
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      # This shard's record of what it executes; see the same step in `gates`.
      - run: node scripts/ci-reuse-verified-tree.mjs --record shard-${{ matrix.shard }}
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: ci-executed-shard-${{ matrix.shard }}
          path: evidence/local/ci-executed.json
          if-no-files-found: error
          overwrite: true
      - run: pnpm ci:commitlore
      - run: pnpm install --frozen-lockfile
      - run: pnpm rebuild better-sqlite3
      - run: pnpm native:peercred:build
      - run: pnpm native:fd-vfs:build
      - run: pnpm notes:fetch
      - run: pnpm build
      - run: pnpm gates --tests-only --shard ${{ matrix.shard }}/${{ strategy.job-total }}
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        if: always()
        with:
          name: vitest-results-shard-${{ matrix.shard }}
          path: evidence/local/ci-vitest-results.json
          if-no-files-found: error

  # Branch protection requires the check named exactly `verify` (app_id 15368, GitHub Actions) —
  # confirmed against this repository's live protection settings, not assumed. A matrixed job can
  # never produce that name, because GitHub always appends the matrix values to its check name.
  # This job carries no matrix, so its own check name is exactly its `name:` — `verify` — with
  # nothing appended.
  #
  # `if: always()` is load-bearing, not decoration. Without it, this job's default condition is
  # "the jobs it needs all succeeded" — so the moment any verification job fails or the run is
  # cancelled, this job would not run at all, and GitHub reports a job that never ran as
  # `skipped`, not `failure`. A `skipped` required check is treated as satisfied on this platform
  # (the same "coverage implied, not observed" shape this whole effort has been about), so a gate
  # that only runs on the happy path would be a green light exactly when it must not be one.
  # `always()` forces this job to run in every case, so it is this step's own `run:` that decides
  # pass or fail — never GitHub's default treatment of an unrun job.
  #
  # The check itself must read `== 'success'` (an allow-list), not `!= 'failure'` (a deny-list):
  # `needs.<job>.result` can be `success`, `failure`, `cancelled`, or `skipped`. An allow-list
  # fails closed on `cancelled` and `skipped` too, with no separate case needed. A matrix job's
  # result is `success` only when every shard succeeded, so one failed or cancelled shard fails it.
  #
  # The one `skipped` it accepts is the shards on a `push` that `test-reuse` proved — and only
  # with `test-reuse` itself `success` and answering exactly `true`. `gates` has no such excuse.
  #
  # Then, when the shards ran, it joins their reports into the one whole-suite
  # `vitest-results-<node>` artifact readers already download, and refuses if the shards between
  # them did not run every test file in the tree exactly once.
  verify-gate:
    name: verify
    needs: [test-reuse, gates, verify-matrix]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: require the gates and every test shard to have actually succeeded
        env:
          REUSED_RUN: ${{ needs.test-reuse.outputs.run_id }}
          REUSED_HEAD: ${{ needs.test-reuse.outputs.head_sha }}
          REUSED_TREE: ${{ needs.test-reuse.outputs.tree_sha }}
        run: |
          gates="${{ needs.gates.result }}"
          shards="${{ needs.verify-matrix.result }}"
          reuse_job="${{ needs.test-reuse.result }}"
          reuse="${{ needs.test-reuse.outputs.reuse }}"
          event="${{ github.event_name }}"
          # Print the values before deciding on them. A gate that only prints its verdict cannot be
          # told apart from a gate that read the wrong input, which is the position this check was
          # in when it failed while both matrix legs were green.
          echo "needs.gates.result=${gates}"
          echo "needs.verify-matrix.result=${shards}"
          echo "needs.test-reuse.result=${reuse_job} reuse=${reuse} event=${event}"
          if [ "$gates" != "success" ]; then
            echo "the gates did not succeed — failing the required verify check"
            exit 1
          fi
          if [ "$shards" = "success" ]; then
            echo "the gates and every test shard succeeded"
          elif [ "$shards" = "skipped" ] && [ "$reuse_job" = "success" ] && [ "$reuse" = "true" ] && [ "$event" = "push" ]; then
            echo "the gates succeeded; the suite was not run again because pull-request run ${REUSED_RUN} passed every shard on head ${REUSED_HEAD}, tree ${REUSED_TREE}"
          else
            echo "the test shards did not succeed — failing the required verify check"
            exit 1
          fi
      - if: needs.verify-matrix.result == 'success'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - if: needs.verify-matrix.result == 'success'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: vitest-results-shard-*
          path: shard-results
      - if: needs.verify-matrix.result == 'success'
        run: node scripts/merge-vitest-results.mjs --out evidence/local/ci-vitest-results.json shard-results/*/ci-vitest-results.json
      - if: needs.verify-matrix.result == 'success'
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: vitest-results-${{ env.NODE_VERSION }}
          path: evidence/local/ci-vitest-results.json
          if-no-files-found: error
