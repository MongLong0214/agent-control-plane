# `project-ci` here is this workflow's own display name (the Actions-tab label) — it has never
# been a job id or a check-run name in this file, so it is not at risk from the defect below by
# itself. The defect is generic, though: GitHub always names a check run after the *job* (or a
# job's explicit `name:`), never the workflow, and always appends matrix values to whichever name
# that job has. `verify-matrix` hit this because branch protection, `docs/ops/branch-protection.md`,
# and `tests/e2e/real-component-integration.test.ts` all pin the literal string `verify` — the full
# audit of what depends on that string is in PR #694's body. If any *other* job here (or
# `verify-gate` itself) is ever given a matrix while something still depends on its bare name, it
# breaks the identical way: the name that dependants expect stops being producible, silently.
name: project-ci
on:
  push:
    branches: [main, 'release/**', 'hotfix/**']
  pull_request:
    branches: [main, 'feature/**', 'release/**']
jobs:
  # This job's id used to be `verify`, which is also the literal string branch protection
  # requires (contexts: ["verify"]). Adding the matrix below made every check GitHub reports for
  # this job get the matrix value appended — "verify (22.18.0)", "verify (22)" — and a check
  # literally named `verify` stopped existing. Branch protection then waits for a check that can
  # never appear, on every PR in the repository, not just this one. `name: verify` here keeps the
  # per-leg checks reading the same as before ("verify (22.18.0)", "verify (22)"); `verify-gate`
  # below is what now produces the bare `verify` check branch protection actually requires.
  verify-matrix:
    name: verify
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        # `package.json` declares `"node": ">=22.18.0"`. `22` (bare) is a moving alias that
        # resolves to whatever the newest 22.x is on the day the job runs — it can never fail at
        # the declared range's actual edge, only at whatever is currently newest. `22.18.0` is
        # that edge, pinned exactly rather than aliased.
        #
        # It was originally `22.0.0`, matching the range this repository had merely written down.
        # That entry is what found the real floor: `22.0.0` failed `pnpm migrations:check` with
        # `ERR_UNKNOWN_FILE_EXTENSION` for `.ts` — `scripts/verify-migrations-are-immutable.mjs`
        # does `await import(".../src/db/migrations.ts")` directly, under plain `node`, with no
        # transpiler. Unflagged native TypeScript execution shipped in Node 22.18.0 (2025-07-31);
        # `22.17.1` still throws that exact error, checked empirically with `nvm`. So `>=22` was
        # never true for this repository's own tooling — nothing had ever tested the edge before
        # this entry existed, and it found the gap on its first real use, not the one it went
        # looking for (ADR-0010).
        #
        # `node-gyp`'s own range (ADR-0010: pinned to `11.5.0`, `^18.17.0 || >=20.5.0`) already
        # covers `22.18.0` — moving the floor up did not require touching that pin again.
        node-version: ["22.18.0", "22"]
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # The trailer check reads every commit message in the range, and the default
          # shallow clone has one. A range that cannot be resolved makes that check exit 2
          # rather than report a clean result, so this is what keeps it from being a step
          # that always fails and gets deleted.
          fetch-depth: 0
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 10
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm rebuild better-sqlite3
      # ADR-0010: this repository's own binding.gyp + node-addon-api convention for native
      # addons, prebuilt here rather than compiled on load. macos-15 is the only runner this job
      # uses, so this is also where #539's Darwin-only peercred addon gets its one build.
      - run: pnpm native:peercred:build
      - run: pnpm lint
      - run: pnpm terminology
      # #705 — this check is correct and was reachable from neither package.json nor here, so
      # a real defect it found (a `_STALE` code absent from STALENESS_REASON_CODES) reported
      # into a room nobody was in. Dependency-free by the same PRD §17.4 contract as
      # `terminology` and `release:version` above and below it.
      - run: pnpm reason-codes
      # Reports, never fails: stale evidence is a fact to see, and a check that fails on a
      # true statement gets switched off. --strict exists for when a release wants a gate.
      - run: pnpm evidence:freshness
      - run: pnpm invariants
      - run: pnpm typecheck
      # #705's static half: every direct script has a plausible invocation site. The command
      # prints that this cannot establish execution and that dynamic measurement remains #705.
      - run: pnpm scripts:plausible-callers
      # Seconds, and it answers the question that actually goes stale: does every mutation row
      # still name a line that exists. Editing a guarded line renames its anchor and the row
      # silently stops checking anything — three times on one branch, each found only when the
      # full sweep reached it forty minutes in. This fails first instead.
      - run: pnpm guards:anchors
      # The question that found three of the four findings in this branch's final review: which
      # operand of a refusal does no falsifiability row name. The harness answers "is this guard
      # tested" for the lines someone wrote a row for; it cannot answer which lines nobody did.
      - run: pnpm guards:operands
      # #539 lands src/core/peercred.ts unreachable from every live surface on purpose — a new
      # call site (or a ControlPlane export) is a RED mutant here, not a deliverable.
      - run: pnpm guards:peercred-unreachable
      # Two defect classes this branch hit twice each, turned into checks so the third time
      # is a failing step rather than a review finding.
      #
      # `migrations:check` freezes what each migration does. v24's DDL was edited in place
      # across two correction rounds; a database created at the earlier one then sat at that
      # version with bodies nobody's code expected and could not settle a turn.
      #
      # `schema:census` refuses a table guarded on UPDATE or DELETE and open on INSERT.
      # `INSERT OR REPLACE` skips the implicit delete's triggers on a connection with
      # recursive_triggers off, which is any connection ACP did not open. Adding it found two
      # more tables in that shape within a minute of first running.
      - run: pnpm migrations:check
      - run: pnpm schema:census
      # #676: Every inline-SQL direct call whose TypeScript property symbol is exactly Db.run and
      # that names a turn-fence table is in that table's declared application owner.
      - run: pnpm schema:writers
      # A trigger sentinel with no entry in TRIGGER_CODES reaches its caller as a raw Error
      # instead of a Decision, so a refusal is indistinguishable from a bug. The whole
      # canonical-turn ledger was in that state, and a census found five more that predate it.
      - run: pnpm schema:denials
      # A trigger declared and named by no required registry is created on a fresh install and
      # never checked again — drop it from a live database and nothing notices. The registries are
      # hand-written lists, and four defects on this branch were a hand-written list that stopped
      # matching what it enumerates.
      - run: pnpm schema:registry
      # A wrapped CommitLore trailer is not a trailer: git ends the block at the continuation
      # line and the record is stored by nobody. It happened six times on 2026-08-22, and
      # every one was *detected* — `commitlore validate` printed a warning and exited 0, after
      # the commit it described already existed. The local commit-msg hook refuses it up
      # front; this is the half that holds for a clone that never installed the hooks.
      - run: pnpm trailers ${{ github.event.pull_request.base.sha && format('{0}..HEAD', github.event.pull_request.base.sha) || 'HEAD~1..HEAD' }}
      - run: pnpm build
      # One suite run in each matrix leg. Its JSON belongs to the gate that judged this exact run;
      # the independent traceability job below makes its own result in its own clean checkout.
      - run: pnpm test

  # These checks used to follow `pnpm test` in each matrix workspace. A non-test Vitest exit
  # skipped all three, while a killed mutation run could also leave that workspace deliberately
  # broken. Each check now starts from its own checkout and still runs when verify-matrix fails.
  # The shared setup-node cache key is the lockfile hash, so the dependency store remains reusable
  # across jobs even though no working tree is shared.
  guard-falsifiability:
    name: guard falsifiability
    needs: verify-matrix
    if: always()
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 10
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22.18.0"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm rebuild better-sqlite3
      - run: pnpm native:peercred:build
      - run: pnpm guards:falsifiable

  # Traceability needs a complete Vitest JSON result. It intentionally makes that result in this
  # clean checkout instead of consuming a possibly absent artifact from a failed matrix leg.
  # `pnpm trace` states this fallback and runs the suite once with its own JSON output path.
  traceability:
    name: traceability
    needs: verify-matrix
    if: always()
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 10
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22.18.0"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm rebuild better-sqlite3
      - run: pnpm native:peercred:build
      - run: pnpm trace

  ssot:
    name: SSOT reconciliation
    needs: verify-matrix
    if: always()
    runs-on: macos-15
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: node scripts/ssot-report.mjs
        env:
          GH_TOKEN: ${{ github.token }}

  # Branch protection requires the check named exactly `verify` (app_id 15368, GitHub Actions) —
  # confirmed against this repository's live protection settings, not assumed. `verify-matrix`
  # above cannot ever produce that name once it carries a matrix: GitHub always appends the
  # matrix values to a matrixed job's check name, so its checks are "verify (22.18.0)" and
  # "verify (22)", never bare "verify". This job carries no matrix, so its own check name is
  # exactly its `name:` — `verify` — with nothing appended. It is what makes the required check
  # exist again, without touching the required-check string itself.
  #
  # `if: always()` is load-bearing, not decoration. Without it, this job's default condition is
  # "the jobs it needs all succeeded" — so the moment any verification job fails or the run is
  # cancelled, this job would not run at all, and GitHub reports a job that never ran as
  # `skipped`, not `failure`. A `skipped` required check is treated as satisfied on this platform
  # (the same "coverage implied, not observed" shape this whole effort has been about), so a gate
  # that only runs on the happy path would be a green light exactly when it must not be one.
  # `always()` forces this job to run in every case, so it is this step's own `run:` that decides
  # pass or fail — never GitHub's default treatment of an unrun job.
  #
  # The check itself must read `== 'success'` (an allow-list), not `!= 'failure'` (a deny-list):
  # `needs.<job>.result` can be `success`, `failure`, `cancelled`, or `skipped`. The matrix's own
  # `fail-fast: false` means one leg failing does not cancel the other, while its aggregate result
  # is still `failure` if any leg failed. An allow-list makes every other job fail closed on
  # `cancelled` and `skipped` too, with no separate case needed.
  verify-gate:
    name: verify
    needs: [verify-matrix, guard-falsifiability, traceability, ssot]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: require every verification job to have actually succeeded
        run: |
          verify_matrix="${{ needs.verify-matrix.result }}"
          guard_falsifiability="${{ needs.guard-falsifiability.result }}"
          traceability="${{ needs.traceability.result }}"
          ssot="${{ needs.ssot.result }}"
          if [ "$verify_matrix" != "success" ] || \
             [ "$guard_falsifiability" != "success" ] || \
             [ "$traceability" != "success" ] || \
             [ "$ssot" != "success" ]; then
            echo "verification jobs: verify-matrix=$verify_matrix guard-falsifiability=$guard_falsifiability traceability=$traceability ssot=$ssot"
            echo "at least one verification job was not successful — failing the required verify check"
            exit 1
          fi
          echo "every verification job succeeded"
