name: project-ci
on:
  push:
    branches: [main, dev, 'release/**', 'hotfix/**']
  pull_request:
    branches: [main, dev, 'feature/**', 'release/**']
jobs:
  verify:
    runs-on: macos-15
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 10
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm rebuild better-sqlite3
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      # One suite run, not two. `trace` needs a JSON reporter pass; it used to obtain that by
      # running the whole suite a second time, which doubled a suite that spawns real
      # sandboxed children and failed on the runner while the first run passed.
      - run: pnpm test -- --reporter=default --reporter=json --outputFile.json=evidence/local/ci-vitest-results.json
      - run: pnpm trace
        env:
          ACP_VITEST_RESULTS: evidence/local/ci-vitest-results.json
      - run: node scripts/ssot-report.mjs
        env:
          GH_TOKEN: ${{ github.token }}
