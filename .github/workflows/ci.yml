# `project-ci` here is this workflow's own display name (the Actions-tab label) — it has never
# been a job id or a check-run name in this file, so it is not at risk from the defect below by
# itself. The defect is generic, though: GitHub always names a check run after the *job* (or a
# job's explicit `name:`), never the workflow, and always appends matrix values to whichever name
# that job has. `verify-matrix` hit this because branch protection, `docs/ops/branch-protection.md`,
# and `tests/e2e/real-component-integration.test.ts` all pin the literal string `verify` — the full
# audit of what depends on that string is in PR #694's body. If any *other* job here (or
# `verify-gate` itself) is ever given a matrix while something still depends on its bare name, it
# breaks the identical way: the name that dependants expect stops being producible, silently.
name: project-ci
on:
  push:
    branches: [main, 'release/**', 'hotfix/**']
  # No base filter. `branches` under `pull_request` matches the PR's *base*, so every prefix a
  # pull request can target has to be listed or that PR gets no checks at all — and a list of
  # prefixes goes stale exactly like any other check keyed by a name rather than by content.
  #
  # It already had. Measured 2026-09-12 against `git ls-remote --heads origin`: `fix/` 56,
  # `feat/` 39, `terra10/` 27, `docs/` 9, `test/` 3, and `feature/` — the prefix this filter
  # named — **1**. `release/` was 0, and no merge commit in this repository's history came from a
  # `feature/` branch. So the filter covered `main` and effectively nothing else, and #855, based
  # on a `feat/` branch, got **zero** check runs.
  #
  # Zero checks is worse than a red one. `gh pr list --json statusCheckRollup` summarises it as
  # `fail=0 pend=0`, which is indistinguishable from all-green, and a base branch carries no
  # protection rules to notice. `scripts/merge-pr.mjs:133` is what actually caught it — "no check
  # reported on <sha>. A green claim needs a run." — and `gh pr merge` goes around that.
  #
  # Ruled out: listing `feat/**` and `fix/**` beside the others. It fixes today's two prefixes and
  # leaves the same mechanism in place for the next one, with no check that would notice — which
  # is how this filter came to name a prefix used once (#857).
  pull_request:
jobs:
  # This job's id used to be `verify`, which is also the literal string branch protection
  # requires (contexts: ["verify"]). Adding the matrix below made every check GitHub reports for
  # this job get the matrix value appended — "verify (22.18.0)", "verify (22)" — and a check
  # literally named `verify` stopped existing. Branch protection then waits for a check that can
  # never appear, on every PR in the repository, not just this one. `name: verify` here keeps the
  # per-leg checks reading the same as before ("verify (22.18.0)", "verify (22)"); `verify-gate`
  # below is what now produces the bare `verify` check branch protection actually requires.
  verify-matrix:
    name: verify
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        # `package.json` declares `"node": ">=22.18.0"`. `22` (bare) is a moving alias that
        # resolves to whatever the newest 22.x is on the day the job runs — it can never fail at
        # the declared range's actual edge, only at whatever is currently newest. `22.18.0` is
        # that edge, pinned exactly rather than aliased.
        #
        # It was originally `22.0.0`, matching the range this repository had merely written down.
        # That entry is what found the real floor: `22.0.0` failed `pnpm migrations:check` with
        # `ERR_UNKNOWN_FILE_EXTENSION` for `.ts` — `scripts/verify-migrations-are-immutable.mjs`
        # does `await import(".../src/db/migrations.ts")` directly, under plain `node`, with no
        # transpiler. Unflagged native TypeScript execution shipped in Node 22.18.0 (2025-07-31);
        # `22.17.1` still throws that exact error, checked empirically with `nvm`. So `>=22` was
        # never true for this repository's own tooling — nothing had ever tested the edge before
        # this entry existed, and it found the gap on its first real use, not the one it went
        # looking for (ADR-0010).
        #
        # `node-gyp`'s own range (ADR-0010: pinned to `11.5.0`, `^18.17.0 || >=20.5.0`) already
        # covers `22.18.0` — moving the floor up did not require touching that pin again.
        node-version: ["22.18.0", "22"]
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # The trailer check reads every commit message in the range, and the default
          # shallow clone has one. A range that cannot be resolved makes that check exit 2
          # rather than report a clean result, so this is what keeps it from being a step
          # that always fails and gets deleted.
          fetch-depth: 0
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 10
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      # Dependency-free and first: the same working-tree check as pre-commit catches a workflow
      # package-script mismatch or invalid Bash before install and the test matrix spend minutes.
      - run: pnpm ci:preflight
      - run: pnpm install --frozen-lockfile
      - run: pnpm rebuild better-sqlite3
      # ADR-0010: this repository's own binding.gyp + node-addon-api convention for native
      # addons, prebuilt here rather than compiled on load. macos-15 is the only runner this job
      # uses, so this is also where #539's Darwin-only peercred addon gets its one build.
      - run: pnpm native:peercred:build
      - run: pnpm native:fd-vfs:build
      # One step, one manifest, one executor. Every gate this job runs is in
      # `scripts/lib/prepush-gates.mjs`, and `pnpm gates` is what a developer runs before pushing
      # — the same command, the same order, the same fail-fast stop. It replaced twenty listed
      # steps here because a list CI owns is a list nobody can execute: #736 was verified locally
      # against a hand-made set of four checks and failed here in 35 seconds on `pnpm lint`, which
      # was not on it, and the same wrong set went into four subagent briefs.
      #
      # The job log stays per-gate. The runner prints a banner and an exit code for every gate, an
      # `::error::` annotation naming the one that failed, and a table of all of them to the run's
      # step summary — which is also the readback that this job ran the runner rather than a step
      # list of its own.
      #
      # `pnpm gates:ci-parity` (a gate inside the manifest) refuses any step added to this job that
      # verifies something the manifest does not hold, in either direction. Adding `- run: pnpm
      # <check>` below is a red build, not a quiet divergence.
      #
      # ACP_TRAILERS_RANGE is the one workflow-specific value the runner takes: which commits to
      # read is a property of the event GitHub is handling, not of the gate. Unset locally, where
      # the check uses its own default of `origin/main..HEAD`.
      - run: pnpm gates
        env:
          ACP_TRAILERS_RANGE: ${{ github.event.pull_request.base.sha && format('{0}..HEAD', github.event.pull_request.base.sha) || 'HEAD~1..HEAD' }}
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        if: always()
        with:
          name: vitest-results-${{ matrix.node-version }}
          path: evidence/local/ci-vitest-results.json
          if-no-files-found: error

  # These checks used to follow `pnpm test` in each matrix workspace. A non-test Vitest exit
  # skipped all three, while a killed mutation run could also leave that workspace deliberately
  # broken. Each check now starts from its own checkout and still runs when verify-matrix fails.
  # The shared setup-node cache key is the lockfile hash, so the dependency store remains reusable
  # across jobs even though no working tree is shared.
  #
  # Sharded, and the shards are separate *checkouts* rather than separate processes in one. The
  # harness edits the working tree in place and restores it, so two rows running against one tree
  # would let the second read the first's mutant as the real source — that is why it has never run
  # alongside `vitest` and never twice at once. A matrix leg is its own runner with its own clone,
  # so nothing about that rule is being bent here: what moves is which rows a process runs, not how
  # any row is judged.
  #
  # 553 rows (548 after the `skip:` ones), measured, at roughly ten seconds apiece — an hour and a
  # half of wall-clock on the single job this replaces, on every PR, as the whole critical path.
  # Four legs because that is the wall-clock target and because four is the smallest number that
  # reaches it; each leg also pays the fixed setup below (checkout, install, three native builds),
  # so the per-job total falls by less than four, and more legs buy less each time while asking
  # macOS runner slots this account has only been measured supplying three of at once.
  #
  # `shard: ["1/4", ...]` rather than an index and a separate total: one literal per leg means the
  # count cannot disagree with itself. What the literals *cannot* say is that all four are here —
  # deleting one leaves three green jobs and a quarter of the table unchecked — so
  # `tests/process/the-falsifiability-sweep-is-sharded-without-gaps.test.ts` reads this list back
  # out of this file and proves it partitions the table.
  guard-falsifiability:
    name: guard falsifiability
    needs: verify-matrix
    if: always()
    runs-on: macos-15
    strategy:
      # A shard that fails must not cancel the others. Each leg checks a disjoint quarter, so
      # cancelling the rest converts one known failure into three unknown results — and a
      # `cancelled` leg is exactly the state the gate job below reads as not-success.
      fail-fast: false
      matrix:
        shard: ["1/4", "2/4", "3/4", "4/4"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 10
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22.18.0"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm rebuild better-sqlite3
      - run: pnpm native:peercred:build
      - run: pnpm native:fd-vfs:build
      # The unmutated verdict for every named test, from the matrix leg the gate judged, on this
      # same commit. A kill is a difference — the named test passed before the guard was removed
      # and failed after — and without this the sweep only ever measured the second half, so a
      # test already failing for its own reasons read as killed by any mutation (#828).
      #
      # Not a second execution: re-running the suite here would be a different run, and a verdict
      # from a run no gate looked at is the thing `traceability` refuses just below for the same
      # reason. `test -s` keeps a missing artifact from reading as a satisfied baseline, rather
      # than letting the harness fall back to its no-baseline mode where every kill is trusted.
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: vitest-results-22.18.0
          path: evidence/baseline
      - run: test -s evidence/baseline/ci-vitest-results.json
      # The harness refuses a shard argument that selects no row, so a mistyped or out-of-range
      # leg is a red job rather than a PASS printed over an empty table.
      - run: pnpm guards:falsifiable --shard=${{ matrix.shard }}
        env:
          ACP_FALSIFIABILITY_BASELINE: ${{ github.workspace }}/evidence/baseline/ci-vitest-results.json

  # The sweep's verdict, in one place, now that no single job holds it.
  #
  # Before the matrix, `guard falsifiability` was one check and its colour was the answer. A matrix
  # turns that name into `guard falsifiability (1/4)` and three more, and GitHub reports a job that
  # never ran as `skipped` — which reads as satisfied, not as unknown. So this job carries the bare
  # name, needs every leg, and decides from the aggregate result. `if: always()` and an allow-list
  # on `== 'success'` are the same two rules `verify-gate` below runs on, for the same reason:
  # `failure`, `cancelled` and `skipped` must all be red here, and only `success` green.
  guard-falsifiability-gate:
    name: guard falsifiability
    needs: [guard-falsifiability]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: require every falsifiability shard to have actually succeeded
        run: |
          shards="${{ needs.guard-falsifiability.result }}"
          # Print the input before deciding on it, the same readback verify-gate prints: a gate
          # that only announces its verdict cannot be told apart from one reading the wrong field.
          echo "needs.guard-falsifiability.result=${shards}"
          if [ "$shards" != "success" ]; then
            echo "at least one falsifiability shard did not succeed — the sweep did not pass"
            exit 1
          fi
          echo "every falsifiability shard succeeded"

  # Traceability needs a complete Vitest JSON result, and it consumes the one the gate judged
  # rather than making its own. A second execution is a different run: whatever it reports is a
  # claim about something no gate looked at. A missing artifact fails this job rather than
  # silently falling back to a fresh suite — see the download and `test -s` steps below.
  traceability:
    name: traceability
    needs: verify-matrix
    if: always()
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 10
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22.18.0"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm rebuild better-sqlite3
      - run: pnpm native:peercred:build
      - run: pnpm native:fd-vfs:build
      # The result set comes from the matrix leg the gate judged, on this same commit. Without it
      # `pnpm trace` runs the suite again, and a second execution is a different run — whatever it
      # reports is a claim about something no gate looked at. `if-no-files-found: error` above and
      # the absent-file failure below both keep a missing artifact from reading as a passing trace.
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: vitest-results-22.18.0
          path: evidence/local
      - run: test -s evidence/local/ci-vitest-results.json
      - run: pnpm trace
        env:
          ACP_VITEST_RESULTS: evidence/local/ci-vitest-results.json

  ssot:
    name: SSOT reconciliation
    needs: verify-matrix
    if: always()
    runs-on: macos-15
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: node scripts/ssot-report.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      # `verify-tracker-loci-resolve.mjs` (#597's citation-staleness check) does NOT run here.
      # It was here once and was wrong to be: it is a fact about the *tracker*, not about this
      # PR's diff, and — unlike `ssot-report.mjs` above, whose reconciliation only turns red when
      # someone actively mis-records a marker — it is red *today*, on an unedited `main`, because
      # an open issue (#649) already cites a moved line. Requiring it here would block every PR's
      # merge on an issue-thread fact nothing in the diff touched, for however long that issue
      # stays open — which is the coupling that gets a check silenced rather than fixed. It runs
      # instead in `.github/workflows/tracker-loci.yml` on a schedule, where it can fail loudly
      # without failing anyone's merge.

  # Branch protection requires the check named exactly `verify` (app_id 15368, GitHub Actions) —
  # confirmed against this repository's live protection settings, not assumed. `verify-matrix`
  # above cannot ever produce that name once it carries a matrix: GitHub always appends the
  # matrix values to a matrixed job's check name, so its checks are "verify (22.18.0)" and
  # "verify (22)", never bare "verify". This job carries no matrix, so its own check name is
  # exactly its `name:` — `verify` — with nothing appended. It is what makes the required check
  # exist again, without touching the required-check string itself.
  #
  # `if: always()` is load-bearing, not decoration. Without it, this job's default condition is
  # "the jobs it needs all succeeded" — so the moment any verification job fails or the run is
  # cancelled, this job would not run at all, and GitHub reports a job that never ran as
  # `skipped`, not `failure`. A `skipped` required check is treated as satisfied on this platform
  # (the same "coverage implied, not observed" shape this whole effort has been about), so a gate
  # that only runs on the happy path would be a green light exactly when it must not be one.
  # `always()` forces this job to run in every case, so it is this step's own `run:` that decides
  # pass or fail — never GitHub's default treatment of an unrun job.
  #
  # The check itself must read `== 'success'` (an allow-list), not `!= 'failure'` (a deny-list):
  # `needs.<job>.result` can be `success`, `failure`, `cancelled`, or `skipped`. The matrix's own
  # `fail-fast: false` means one leg failing does not cancel the other, while its aggregate result
  # is still `failure` if any leg failed. An allow-list makes every other job fail closed on
  # `cancelled` and `skipped` too, with no separate case needed.
  # The required check is the test suite. The other three still run, still report, and are still
  # read — but they no longer gate the merge. Making all four blocking turned every slow or flaky
  # verification job into a merge stop, and the cost of that landed on unrelated PRs all day.
  verify-gate:
    name: verify
    needs: [verify-matrix]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: require the test matrix to have actually succeeded
        run: |
          verify_matrix="${{ needs.verify-matrix.result }}"
          # Print the value before deciding on it. A gate that only prints its verdict cannot be
          # told apart from a gate that read the wrong input, which is the position this check was
          # in when it failed while both matrix legs were green.
          echo "needs.verify-matrix.result=${verify_matrix}"
          if [ "$verify_matrix" != "success" ]; then
            echo "the test matrix did not succeed — failing the required verify check"
            exit 1
          fi
          echo "the test matrix succeeded"
