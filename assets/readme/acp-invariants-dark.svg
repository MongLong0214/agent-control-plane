<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="960" height="356" viewBox="0 0 960 356" role="img" aria-labelledby="t d">
<title id="t">Eight hard invariants, CP-HI-01 to CP-HI-08</title>
<desc id="d">Eight cards. CP-HI-01 Managed Write Guard: ACP-owned manifest, worktree and GitHub writes pass the Guard, and agents write only inside an assigned worktree and live claim. CP-HI-02 Single Runtime Authority: no project actor completes a run, publishes a gate or merges. CP-HI-03 Candidate Contract Pinning: verification is bound to the approved contract digest and the frozen candidate. CP-HI-04 Independent Quality Role: a blind reviewer is never a producer of the same run, and the final CEO role is separate. CP-HI-05 Trusted GitHub Credential: only the daemon may access the credential for the production gate and programmatic merge. CP-HI-06 Exact Evidence: verification, review, gate and merge evidence bind one exact candidate snapshot, and changed source stales it. CP-HI-07 Non-delegable Human Role: provider failover does not invent owner authority. CP-HI-08 No Silent Degradation: missing, stale, failed or unisolated evidence never appears as PASS.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}
.h{fill:#e6eaf1;font-size:21px;font-weight:700;letter-spacing:-.2px}
.hs{fill:#9aa4b5;font-size:14.5px}
.tile{fill:#151b24;stroke:#2c3543;stroke-width:1.2}
.id{font-size:12.5px;font-weight:700;letter-spacing:1.2px}
.tt{fill:#e6eaf1;font-size:15.5px;font-weight:650;letter-spacing:-.1px}
.ds{fill:#9aa4b5;font-size:13.5px}
.a{fill:#7d9bff}.v{fill:#3fcf9c}.r{fill:#b495ff}.w{fill:#ff8c57}.g{fill:#e3b341}
.sa{stroke:#7d9bff}.sv{stroke:#3fcf9c}.sr{stroke:#b495ff}.sw{stroke:#ff8c57}.sg{stroke:#e3b341}
.lk{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.c{animation:rise .55s cubic-bezier(.2,.9,.2,1) backwards}
.c1{animation-delay:.05s}.c2{animation-delay:.12s}.c3{animation-delay:.19s}.c4{animation-delay:.26s}
.c5{animation-delay:.33s}.c6{animation-delay:.40s}.c7{animation-delay:.47s}.c8{animation-delay:.54s}
.sh{animation:sweep 6s cubic-bezier(.6,0,.4,1) 1.4s infinite backwards}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
@keyframes sweep{from{transform:translateX(-220px)}35%,to{transform:translateX(1180px)}}
@media (prefers-reduced-motion:reduce){.c{animation:none}.sh{display:none}}
</style>
<defs>
<linearGradient id="shg" x1="0" x2="1"><stop offset="0" stop-color="#7d9bff" stop-opacity="0"/><stop offset=".5" stop-color="#7d9bff" stop-opacity=".10"/><stop offset="1" stop-color="#7d9bff" stop-opacity="0"/></linearGradient>
<clipPath id="tc">
<rect x="0" y="62" width="228" height="134" rx="12"/><rect x="244" y="62" width="228" height="134" rx="12"/><rect x="488" y="62" width="228" height="134" rx="12"/><rect x="732" y="62" width="228" height="134" rx="12"/>
<rect x="0" y="212" width="228" height="134" rx="12"/><rect x="244" y="212" width="228" height="134" rx="12"/><rect x="488" y="212" width="228" height="134" rx="12"/><rect x="732" y="212" width="228" height="134" rx="12"/>
</clipPath>
<g id="lock"><rect x="-7" y="-1" width="14" height="10" rx="2.5"/><path d="M-4-1v-3.2a4 4 0 0 1 8 0V-1"/></g>
</defs>
<text class="h" x="0" y="26">Eight hard invariants</text>
<text class="hs" x="0" y="48">Each is enforced in typed code and database constraints, never in a policy engine. Normative text: PRD §4.</text>

<g class="c c1"><rect class="tile" x="0" y="62" width="228" height="134" rx="12"/><rect class="a" x="0" y="74" width="4" height="30" rx="2"/>
<text class="id a" x="18" y="90">CP-HI-01</text><use xlink:href="#lock" x="206" y="84" class="lk sa"/>
<text class="tt" x="18" y="116">Managed Write Guard</text>
<text class="ds" x="18" y="139">Manifest, worktree and GitHub</text><text class="ds" x="18" y="157">writes pass the Guard; agents</text><text class="ds" x="18" y="175">write only inside a live claim</text></g>

<g class="c c2"><rect class="tile" x="244" y="62" width="228" height="134" rx="12"/><rect class="a" x="244" y="74" width="4" height="30" rx="2"/>
<text class="id a" x="262" y="90">CP-HI-02</text><use xlink:href="#lock" x="450" y="84" class="lk sa"/>
<text class="tt" x="262" y="116">Single Runtime Authority</text>
<text class="ds" x="262" y="139">No project actor completes a</text><text class="ds" x="262" y="157">run, publishes the gate or</text><text class="ds" x="262" y="175">merges on its own</text></g>

<g class="c c3"><rect class="tile" x="488" y="62" width="228" height="134" rx="12"/><rect class="v" x="488" y="74" width="4" height="30" rx="2"/>
<text class="id v" x="506" y="90">CP-HI-03</text><use xlink:href="#lock" x="694" y="84" class="lk sv"/>
<text class="tt" x="506" y="116">Candidate Contract Pinning</text>
<text class="ds" x="506" y="139">Verification binds the</text><text class="ds" x="506" y="157">approved contract digest and</text><text class="ds" x="506" y="175">the frozen candidate</text></g>

<g class="c c4"><rect class="tile" x="732" y="62" width="228" height="134" rx="12"/><rect class="r" x="732" y="74" width="4" height="30" rx="2"/>
<text class="id r" x="750" y="90">CP-HI-04</text><use xlink:href="#lock" x="938" y="84" class="lk sr"/>
<text class="tt" x="750" y="116">Independent Quality Role</text>
<text class="ds" x="750" y="139">A blind reviewer is never a</text><text class="ds" x="750" y="157">producer of the same run; the</text><text class="ds" x="750" y="175">CEO role stays separate</text></g>

<g class="c c5"><rect class="tile" x="0" y="212" width="228" height="134" rx="12"/><rect class="g" x="0" y="224" width="4" height="30" rx="2"/>
<text class="id g" x="18" y="240">CP-HI-05</text><use xlink:href="#lock" x="206" y="234" class="lk sg"/>
<text class="tt" x="18" y="266">Trusted GitHub Credential</text>
<text class="ds" x="18" y="289">Only the daemon can reach</text><text class="ds" x="18" y="307">the credential for the gate</text><text class="ds" x="18" y="325">and programmatic merge</text></g>

<g class="c c6"><rect class="tile" x="244" y="212" width="228" height="134" rx="12"/><rect class="v" x="244" y="224" width="4" height="30" rx="2"/>
<text class="id v" x="262" y="240">CP-HI-06</text><use xlink:href="#lock" x="450" y="234" class="lk sv"/>
<text class="tt" x="262" y="266">Exact Evidence</text>
<text class="ds" x="262" y="289">Verification, review, gate and</text><text class="ds" x="262" y="307">merge bind one snapshot;</text><text class="ds" x="262" y="325">changed source stales them</text></g>

<g class="c c7"><rect class="tile" x="488" y="212" width="228" height="134" rx="12"/><rect class="a" x="488" y="224" width="4" height="30" rx="2"/>
<text class="id a" x="506" y="240">CP-HI-07</text><use xlink:href="#lock" x="694" y="234" class="lk sa"/>
<text class="tt" x="506" y="266">Non-delegable Human Role</text>
<text class="ds" x="506" y="289">Provider failover never</text><text class="ds" x="506" y="307">invents owner authority</text></g>

<g class="c c8"><rect class="tile" x="732" y="212" width="228" height="134" rx="12"/><rect class="w" x="732" y="224" width="4" height="30" rx="2"/>
<text class="id w" x="750" y="240">CP-HI-08</text><use xlink:href="#lock" x="938" y="234" class="lk sw"/>
<text class="tt" x="750" y="266">No Silent Degradation</text>
<text class="ds" x="750" y="289">Missing, stale, failed or</text><text class="ds" x="750" y="307">unisolated evidence never</text><text class="ds" x="750" y="325">appears as PASS</text></g>

<g clip-path="url(#tc)"><rect class="sh" x="0" y="62" width="200" height="284" fill="url(#shg)"/></g>
</svg>
