<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="How ACP works">
<title>How ACP works</title>
<defs>
<marker id="ma" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9 z" fill="#4F46E5"/></marker>
<marker id="mg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9 z" fill="#8c959f"/></marker>
</defs>
<rect width="1200" height="360" fill="#ffffff"/>
<text x="32" y="52" font-size="20" font-weight="600" fill="#1f2328" text-anchor="start">How ACP works</text>
<rect x="32" y="100" width="128" height="104" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
<circle cx="48" cy="100" r="12" fill="#4F46E5" stroke="#ffffff" stroke-width="3"/>
<text x="48" y="104.5" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<text x="96.0" y="144" font-size="15" font-weight="600" fill="#1f2328" text-anchor="middle">Owner request</text>
<text x="96.0" y="165" font-size="12" font-weight="400" fill="#656d76" text-anchor="middle">sets the goal</text>
<line x1="162" y1="152.0" x2="175" y2="152.0" stroke="#4F46E5" stroke-width="1.8" marker-end="url(#ma)"/>
<rect x="176" y="100" width="128" height="104" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
<circle cx="192" cy="100" r="12" fill="#4F46E5" stroke="#ffffff" stroke-width="3"/>
<text x="192" y="104.5" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<text x="240.0" y="144" font-size="15" font-weight="600" fill="#1f2328" text-anchor="middle">CEO</text>
<text x="240.0" y="165" font-size="12" font-weight="400" fill="#656d76" text-anchor="middle">plans, decides</text>
<line x1="306" y1="152.0" x2="319" y2="152.0" stroke="#4F46E5" stroke-width="1.8" marker-end="url(#ma)"/>
<rect x="320" y="100" width="128" height="104" rx="12" fill="#4F46E5" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="336" cy="100" r="12" fill="#ffffff" stroke="#ffffff" stroke-width="3"/>
<text x="336" y="104.5" font-size="12" font-weight="700" fill="#4F46E5" text-anchor="middle">3</text>
<text x="384.0" y="144" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">ACP daemon</text>
<text x="384.0" y="165" font-size="12" font-weight="400" fill="#ffffff" text-anchor="middle" opacity="0.9">agentcpd</text>
<text x="384.0" y="181" font-size="12" font-weight="400" fill="#ffffff" text-anchor="middle" opacity="0.9">owns run state</text>
<line x1="450" y1="152.0" x2="463" y2="152.0" stroke="#4F46E5" stroke-width="1.8" marker-end="url(#ma)"/>
<rect x="464" y="100" width="128" height="104" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
<circle cx="480" cy="100" r="12" fill="#4F46E5" stroke="#ffffff" stroke-width="3"/>
<text x="480" y="104.5" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
<text x="528.0" y="144" font-size="15" font-weight="600" fill="#1f2328" text-anchor="middle">CTO</text>
<text x="528.0" y="165" font-size="12" font-weight="400" fill="#656d76" text-anchor="middle">implements in</text>
<text x="528.0" y="181" font-size="12" font-weight="400" fill="#656d76" text-anchor="middle">isolated worktrees</text>
<line x1="594" y1="152.0" x2="607" y2="152.0" stroke="#4F46E5" stroke-width="1.8" marker-end="url(#ma)"/>
<rect x="608" y="100" width="128" height="104" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
<circle cx="624" cy="100" r="12" fill="#4F46E5" stroke="#ffffff" stroke-width="3"/>
<text x="624" y="104.5" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
<text x="672.0" y="144" font-size="15" font-weight="600" fill="#1f2328" text-anchor="middle">Verification</text>
<text x="672.0" y="165" font-size="12" font-weight="400" fill="#656d76" text-anchor="middle">contract commands</text>
<text x="672.0" y="181" font-size="12" font-weight="400" fill="#656d76" text-anchor="middle">in a sandbox</text>
<line x1="738" y1="152.0" x2="751" y2="152.0" stroke="#4F46E5" stroke-width="1.8" marker-end="url(#ma)"/>
<rect x="752" y="100" width="128" height="104" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
<circle cx="768" cy="100" r="12" fill="#4F46E5" stroke="#ffffff" stroke-width="3"/>
<text x="768" y="104.5" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">6</text>
<text x="816.0" y="144" font-size="15" font-weight="600" fill="#1f2328" text-anchor="middle">Blind review</text>
<text x="816.0" y="165" font-size="12" font-weight="400" fill="#656d76" text-anchor="middle">independent,</text>
<text x="816.0" y="181" font-size="12" font-weight="400" fill="#656d76" text-anchor="middle">every touched file</text>
<line x1="882" y1="152.0" x2="895" y2="152.0" stroke="#4F46E5" stroke-width="1.8" marker-end="url(#ma)"/>
<rect x="896" y="100" width="128" height="104" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
<circle cx="912" cy="100" r="12" fill="#4F46E5" stroke="#ffffff" stroke-width="3"/>
<text x="912" y="104.5" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">7</text>
<text x="960.0" y="144" font-size="15" font-weight="600" fill="#1f2328" text-anchor="middle">CEO decision</text>
<text x="960.0" y="165" font-size="12" font-weight="400" fill="#656d76" text-anchor="middle">confirm or revise</text>
<line x1="1026" y1="152.0" x2="1039" y2="152.0" stroke="#4F46E5" stroke-width="1.8" marker-end="url(#ma)"/>
<rect x="1040" y="100" width="128" height="104" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
<circle cx="1056" cy="100" r="12" fill="#4F46E5" stroke="#ffffff" stroke-width="3"/>
<text x="1056" y="104.5" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">8</text>
<text x="1104.0" y="144" font-size="15" font-weight="600" fill="#1f2328" text-anchor="middle">Merge</text>
<text x="1104.0" y="165" font-size="12" font-weight="400" fill="#656d76" text-anchor="middle">daemon-only</text>
<text x="1104.0" y="181" font-size="12" font-weight="400" fill="#656d76" text-anchor="middle">GitHub credential</text>
<path d="M960.0 204 V240 Q960.0 250 950.0 250 H538.0 Q528.0 250 528.0 240 V207" fill="none" stroke="#8c959f" stroke-width="1.4" stroke-dasharray="5 5" marker-end="url(#mg)"/>
<path d="M672.0 204 V250" fill="none" stroke="#8c959f" stroke-width="1.4" stroke-dasharray="5 5"/>
<circle cx="672.0" cy="250" r="3" fill="#8c959f"/>
<text x="744.0" y="276" font-size="13" font-weight="400" fill="#656d76" text-anchor="middle">verification failed / REVISE → back to CTO</text>
<text x="600" y="328" font-size="14" font-weight="500" fill="#1f2328" text-anchor="middle">Agents propose and supply evidence. agentcpd decides.</text>
</svg>
