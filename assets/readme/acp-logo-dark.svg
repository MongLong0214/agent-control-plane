<svg xmlns="http://www.w3.org/2000/svg" width="680" height="160" viewBox="0 0 680 160" role="img" aria-labelledby="t d">
<title id="t">Agent Control Plane</title>
<desc id="d">The Agent Control Plane mark: four role nodes on a ring, each wired to one central authority square that carries a check mark, beside the wordmark Agent Control Plane and the line single local runtime authority for agent work.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}
.wm{fill:#e6eaf1;font-size:40px;font-weight:700;letter-spacing:-.5px}
.sub{fill:#9aa4b5;font-size:18px;font-weight:400}
.ring{fill:none;stroke:#2c3543;stroke-width:3}
.arc{fill:none;stroke:#7d9bff;stroke-width:3;stroke-linecap:round}
.sp{fill:none;stroke:#3d4859;stroke-width:3;stroke-linecap:round;stroke-dasharray:40;animation:draw .5s cubic-bezier(.4,0,.2,1) .1s backwards}
.nd{stroke-width:3;fill:#0d1117;transform-box:fill-box;transform-origin:center;animation:pop .32s cubic-bezier(.3,1.7,.5,1) backwards}
.n1{stroke:#7d9bff;animation-delay:.35s}.n2{stroke:#3fcf9c;animation-delay:.42s}.n3{stroke:#b495ff;animation-delay:.49s}.n4{stroke:#9aa4b5;animation-delay:.56s}
.core{transform-box:fill-box;transform-origin:center;animation:pop .36s cubic-bezier(.3,1.7,.5,1) .62s backwards}
.ck{fill:none;stroke:#ffffff;stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:40;animation:draw .3s ease-out .9s backwards}
.wmg{animation:rise .5s cubic-bezier(.2,.9,.2,1) .2s backwards}
.pk{fill:none;stroke:#7d9bff;stroke-width:3;stroke-linecap:round;stroke-dasharray:6 60;stroke-dashoffset:6;animation:flow 3.6s cubic-bezier(.5,0,.3,1) infinite}
.p2{animation-delay:.9s}.p3{animation-delay:1.8s}.p4{animation-delay:2.7s}
@keyframes draw{from{stroke-dashoffset:40}}
@keyframes pop{from{transform:scale(0)}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
@keyframes flow{0%{stroke-dashoffset:6;opacity:0}8%{opacity:1}30%{stroke-dashoffset:-34;opacity:1}34%,100%{stroke-dashoffset:-34;opacity:0}}
@media (prefers-reduced-motion:reduce){.sp,.nd,.core,.ck,.wmg{animation:none}.pk{display:none}}
</style>
<defs>
<linearGradient id="cg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#7d9bff"/>
<stop offset="1" stop-color="#a58bff"/>
</linearGradient>
</defs>
<circle class="ring" cx="80" cy="80" r="58"/>
<path class="arc" d="M38.99 38.99A58 58 0 0 1 121.01 38.99"/>
<path class="sp" d="M80 31V56"/>
<path class="sp" d="M129 80H104"/>
<path class="sp" d="M80 129V104"/>
<path class="sp" d="M31 80H56"/>
<path class="pk" d="M80 31V56"/>
<path class="pk p2" d="M129 80H104"/>
<path class="pk p3" d="M80 129V104"/>
<path class="pk p4" d="M31 80H56"/>
<circle class="nd n1" cx="80" cy="22" r="9"/>
<circle class="nd n2" cx="138" cy="80" r="9"/>
<circle class="nd n3" cx="80" cy="138" r="9"/>
<circle class="nd n4" cx="22" cy="80" r="9"/>
<g class="core"><rect x="56" y="56" width="48" height="48" rx="12" fill="url(#cg)"/></g>
<path class="ck" d="M68.5 80.5l7.5 7.5 15.5-16"/>
<g class="wmg">
<text class="wm" x="176" y="80">Agent Control Plane</text>
<text class="sub" x="178" y="114">Single local runtime authority for agent work</text>
</g>
</svg>
