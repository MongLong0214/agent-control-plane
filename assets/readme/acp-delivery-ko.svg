<svg xmlns="http://www.w3.org/2000/svg" width="960" height="236" viewBox="0 0 960 236" role="img" aria-labelledby="t d">
<title id="t">전달: outbox, 깨우기, 읽기, ACK, 펜스</title>
<desc id="d">다섯 단계. 적재: 영속 outbox 행에 역할 키, 바인딩 세대, 대상 세션을 적는다. 깨우기: 역할이 등록한 wake 엔드포인트를 페이로드 없이 두드린다. 읽기: 깨어난 턴이 자신의 인증된 MCP 연결로 대기 중인 행을 읽는다. ACK: role_dispatch_ack, run_ack, handoff_ack 중 하나로 행을 ACKED로 표시한다. 펜스: 페일오버가 일어나면 역할 단위 의도는 새 바인딩으로 옮기고, 이전 세대의 트래픽은 감사 기록을 남긴 뒤 버린다. 행 상태는 PENDING, IN_FLIGHT, SENT, ACKED, REJECTED, EXPIRED 중 하나이고, 아직 대기 중인 in-band 행은 re-wake 창마다 최대 한 번 다시 깨운다.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR','Noto Sans',Helvetica,Arial,sans-serif}
.col{fill:#8a93a3;font-size:12px;font-weight:700;letter-spacing:1.4px}
.note{fill:#5a6577;font-size:12px}
.cd{fill:#f6f8fb;stroke:#d9dfe8;stroke-width:1.2}
.cf{fill:#fdeee6;stroke:#c2410c;stroke-width:1.2}
.n{font-size:12px;font-weight:700;letter-spacing:1px}
.a{fill:#3457d5}.v{fill:#0d8f6a}.w{fill:#c2410c}
.tt{fill:#1b2333;font-size:16px;font-weight:650}
.ds{fill:#5a6577;font-size:12.5px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;font-size:11.5px;fill:#1b2333}
.ln{fill:none;stroke:#b9c2d0;stroke-width:1.6}
.ah{fill:#b9c2d0}
.pk{fill:#3457d5;opacity:0;animation:hop 5s cubic-bezier(.5,0,.3,1) 1s infinite}
.k2{animation-delay:1.5s}.k3{animation-delay:2s}.k4{animation-delay:2.5s}
.sb{fill:#ffffff;stroke:#d9dfe8;stroke-width:1}
.in{animation:rise .5s cubic-bezier(.2,.9,.2,1) backwards}
.i2{animation-delay:.08s}.i3{animation-delay:.16s}.i4{animation-delay:.24s}.i5{animation-delay:.32s}
@keyframes hop{0%{opacity:0;transform:translateX(-10px)}8%{opacity:1}22%{opacity:1;transform:translateX(10px)}30%,100%{opacity:0;transform:translateX(10px)}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
@media (prefers-reduced-motion:reduce){.in{animation:none}.pk{display:none}}
</style>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0 0L10 5L0 10z"/></marker>
</defs>
<text class="col" x="0" y="16">전달 · OUTBOX → WAKE → ACK</text>
<text class="note" x="960" y="16" text-anchor="end">src/outbox · ADR-0003</text>

<g class="in"><rect class="cd" x="0" y="32" width="180" height="128" rx="12"/>
<text class="n a" x="16" y="56">01</text><text class="tt" x="42" y="57">적재</text>
<text class="ds" x="16" y="82">영속 outbox 행에</text><text class="ds" x="16" y="100">역할 키, 바인딩 세대,</text><text class="ds" x="16" y="118">대상 세션을 적는다</text></g>

<g class="in i2"><rect class="cd" x="195" y="32" width="180" height="128" rx="12"/>
<text class="n a" x="211" y="56">02</text><text class="tt" x="237" y="57">깨우기</text>
<text class="ds" x="211" y="82">역할이 등록한 wake</text><text class="ds" x="211" y="100">엔드포인트를 페이로드</text><text class="ds" x="211" y="118">없이 두드린다</text></g>

<g class="in i3"><rect class="cd" x="390" y="32" width="180" height="128" rx="12"/>
<text class="n a" x="406" y="56">03</text><text class="tt" x="432" y="57">읽기</text>
<text class="ds" x="406" y="82">깨어난 턴이 자신의</text><text class="ds" x="406" y="100">인증된 MCP 연결로</text><text class="ds" x="406" y="118">대기 중인 행을 읽는다</text></g>

<g class="in i4"><rect class="cd" x="585" y="32" width="180" height="128" rx="12"/>
<text class="n v" x="601" y="56">04</text><text class="tt" x="627" y="57">ACK</text>
<text class="mono" x="601" y="82">role_dispatch_ack</text><text class="mono" x="601" y="100">run_ack · handoff_ack</text><text class="ds" x="601" y="118">행을 ACKED로 표시한다</text></g>

<g class="in i5"><rect class="cf" x="780" y="32" width="180" height="128" rx="12"/>
<text class="n w" x="796" y="56">05</text><text class="tt" x="822" y="57">펜스</text>
<text class="ds" x="796" y="82">페일오버가 일어나면</text><text class="ds" x="796" y="100">역할 단위 의도는 옮기고,</text><text class="ds" x="796" y="118">이전 세대 트래픽은</text><text class="ds" x="796" y="136">감사 기록 후 버린다</text></g>

<path class="ln" d="M181 96H193" marker-end="url(#ar)"/><path class="ln" d="M376 96H388" marker-end="url(#ar)"/><path class="ln" d="M571 96H583" marker-end="url(#ar)"/><path class="ln" d="M766 96H778" marker-end="url(#ar)"/>
<circle class="pk" cx="187" cy="96" r="3.5"/><circle class="pk k2" cx="382" cy="96" r="3.5"/><circle class="pk k3" cx="577" cy="96" r="3.5"/><circle class="pk k4" cx="772" cy="96" r="3.5"/>

<rect class="sb" x="0" y="176" width="960" height="52" rx="10"/>
<text class="note" x="16" y="198">행 상태</text>
<text class="mono" x="98" y="198">PENDING · IN_FLIGHT · SENT · ACKED · REJECTED · EXPIRED</text>
<text class="note" x="16" y="217">아직 대기 중인 in-band 행은 re-wake 창마다 최대 한 번 다시 깨운다. 모든 봉투는 바인딩 세대를 펜스로 지닌다.</text>
</svg>
