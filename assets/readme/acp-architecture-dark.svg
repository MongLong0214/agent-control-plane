<path class="ln" d="M726 256H760" marker-end="url(#ar)"/><path class="fl" d="M726 256H756"/>
<path class="ln" d="M726 344H760" marker-end="url(#ar)"/><path class="fl" d="M726 344H756"/>
<path class="ln" d="M726 432H760" marker-end="url(#ar)"/><path class="fl" d="M726 432H756"/>

<rect class="bx" x="0" y="486" width="196" height="64" rx="12" stroke-dasharray="4 4"/>
<text class="bs" x="16" y="512">Credentials stay with</text><text class="bs" x="16" y="530">the daemon, never agents</text>
<rect class="bx" x="764" y="486" width="196" height="64" rx="12" stroke-dasharray="4 4"/>
<text class="bs" x="780" y="512">Evidence binds one exact</text><text class="bs" x="780" y="530">candidate snapshot</text>
